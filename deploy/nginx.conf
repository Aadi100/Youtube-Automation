# nginx front door for ONE Clip Studio: visitors on its domain are passed to its dashboard (gunicorn) on this machine. A template: deploy/setup_vps.sh
# fills in the @@...@@ parts and installs it as /etc/nginx/sites-available/<name>. It only answers for its own domain (server_name), so other sites
# on this nginx are not affected. certbot adds the HTTPS part (certificate, port 443, redirect) to this same file and renews the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;

    server_tokens off;                      # do not tell visitors which nginx version this is
    client_max_body_size 2g;                # the editor accepts your own video files up to 2 GB

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:@@PORT@@;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # the studio trusts the FIRST address in X-Forwarded-For as the visitor: set it here, never pass on what the visitor sent
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;        # a big upload streams straight through instead of being saved to disk first
        proxy_buffering off;                # video previews and progress updates reach the browser at once
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
