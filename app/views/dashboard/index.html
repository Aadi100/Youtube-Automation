<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Studio</title>
<style>
:root{
  --bg:#0c0806;--panel:#16100c;--panel2:#1f1610;--panel3:#2b1f16;--line:#34251a;--text:#fbf1e8;--muted:#a9917f;
  --accent:#ff7a18;--accent-soft:rgba(255,122,24,.15);--accent2:#ffb15c;--ember:#ff4d1a;--ok:#34d399;--warn:#facc15;--bad:#f87171;
  --ok-soft:rgba(52,211,153,.14);--warn-soft:rgba(250,204,21,.14);--bad-soft:rgba(248,113,113,.14);--info-soft:rgba(255,177,92,.13);
  --glow1:rgba(255,122,24,.17);--glow2:rgba(255,77,26,.08);--onaccent:#1a0c02;
  --radius:18px;--shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -10px rgba(0,0,0,.5);
}
:root[data-theme=light]{
  --bg:#fbf5ef;--panel:#fff;--panel2:#f8efe6;--panel3:#efe2d4;--line:#eadccb;--text:#2a1a0f;--muted:#7d6652;--accent:#e8590c;--accent-soft:rgba(232,89,12,.1);--accent2:#b45309;--ember:#dc2f02;
  --ok:#0f9f6e;--warn:#a16207;--bad:#d64545;--ok-soft:rgba(15,159,110,.12);--warn-soft:rgba(161,98,7,.13);--bad-soft:rgba(214,69,69,.12);--info-soft:rgba(180,83,9,.1);
  --glow1:rgba(255,122,24,.14);--glow2:rgba(255,77,26,.06);--onaccent:#1a0c02;
  --shadow:0 1px 2px rgba(60,30,10,.06),0 14px 34px -12px rgba(60,30,10,.14);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
::selection{background:var(--accent-soft)}
/* ---- layout */
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:.6px;margin:2px 8px 22px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--ember));display:grid;place-items:center;color:#fff}
.brand .logo svg{width:18px;height:18px}
button svg,.brand .logo svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#approvals img{width:68px;height:120px;object-fit:cover;border-radius:10px}
#themebtn{justify-content:flex-start;width:100%}
.brand span{color:var(--accent)}
.navgroup{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px;opacity:.85}
nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;margin-bottom:2px;font-weight:500;transition:background .15s,color .15s}
nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{background:var(--panel2);color:var(--text);text-decoration:none}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .sp{flex:1}
.sidefoot{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.pill{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.pill.live{color:var(--text);border-color:var(--accent2);background:var(--info-soft)}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.live .d{background:var(--accent2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
main{padding:30px 36px 60px;max-width:1280px;width:100%}
/* ---- headings */
h1{font-size:26px;font-weight:700;letter-spacing:-.3px;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 24px;max-width:70ch}
h2{font-size:15px;font-weight:650;margin:0 0 12px;letter-spacing:.1px}
h3{font-size:13px;margin:0 0 8px}
/* ---- surfaces */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card>h2:first-child{display:flex;align-items:center;gap:8px}
.tile{display:flex;flex-direction:column;justify-content:center}
.tile .n{font-size:30px;font-weight:750;letter-spacing:-.5px;line-height:1.1}
.tile .l,.muted{color:var(--muted)}
.tile .l{font-size:13px;margin-top:2px}
#health{gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#health .card{padding:11px 14px;box-shadow:none;display:grid;grid-template-columns:auto 1fr;column-gap:2px;align-items:center}
#health .card .muted{grid-column:1/-1;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--muted);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}.dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}.dot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
/* ---- tables */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;padding-top:6px}
tr.click{cursor:pointer}tr.click:hover td,tbody tr:hover td{background:var(--panel2)}
.thumb{width:72px;height:41px;object-fit:cover;border-radius:6px;background:var(--panel2);display:block}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel3);color:var(--muted);border:0;text-transform:capitalize}
.badge.rendered,.badge.running,.badge.downloaded{color:var(--accent2);background:var(--info-soft)}
.badge.uploaded,.badge.done,.badge.used{color:var(--ok);background:var(--ok-soft)}
.badge.public{color:#06281d;background:var(--ok)}
.badge.failed,.badge.cancelled{color:var(--bad);background:var(--bad-soft)}
.badge.discarded,.badge.skipped,.badge.declined{color:var(--muted);background:var(--panel3)}
.badge.pending{color:var(--warn);background:var(--warn-soft)}
/* ---- forms and buttons */
label{display:block;color:var(--muted);font-size:12.5px;font-weight:500;margin:14px 0 6px}
input,select,textarea,button{font:inherit;color:var(--text)}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--muted);opacity:.7}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{min-height:120px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--panel3)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent2);box-shadow:0 0 0 3px var(--info-soft)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
button,a.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 15px;cursor:pointer;font-weight:550;transition:background .15s,border-color .15s,transform .05s;display:inline-flex;align-items:center;gap:7px}
button:hover,a.btn:hover{background:var(--panel3);text-decoration:none}
button:active{transform:translateY(1px)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{filter:brightness(1.1);background:var(--accent)}
button.dng{color:var(--bad);border-color:transparent;background:var(--bad-soft)}
button.dng:hover{background:var(--bad-soft);filter:brightness(1.15)}
button:disabled{opacity:.5;cursor:not-allowed}
a.btn{color:var(--text)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}.row .grow{flex:1 1 160px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;border-radius:8px;background:transparent;padding:6px 14px}
.seg button.on{background:var(--accent);color:#fff}
.pgx{display:block}
.pgx-top{display:flex;gap:18px;align-items:center}
.pgx-ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0);display:grid;place-items:center;position:relative;flex:none;transition:background .6s}
.pgx-ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--panel)}
.pgx-ring span{position:relative;font-weight:800;font-size:19px}
.pgx.ok .pgx-ring{background:conic-gradient(var(--ok) 100%, var(--line) 0)}.pgx.bad .pgx-ring{background:conic-gradient(var(--bad) 100%, var(--line) 0)}
.pgx-title{font-weight:700;font-size:17px}.pgx-now{margin-top:3px;font-size:15px}.pgx-now .dots::after{content:"";animation:pgdots 1.4s steps(4,end) infinite}
@keyframes pgdots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
.pgx-bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin:16px 0 14px}
.pgx-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s ease;position:relative;overflow:hidden}
.pgx-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:pgshine 1.8s linear infinite}
.pgx.ok .pgx-bar i{background:var(--ok)}.pgx.bad .pgx-bar i{background:var(--bad)}.pgx.ok .pgx-bar i::after,.pgx.bad .pgx-bar i::after{display:none}
@keyframes pgshine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pgx-so{margin-top:16px}.pgx-so h4{margin:0 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pgx-so div{padding:5px 0;font-size:14px;animation:pgin .4s ease both}.pgx-so div::before{content:"✓";color:var(--ok);font-weight:800;margin-right:9px}
@keyframes pgin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tsm{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:90;display:grid;place-items:center;padding:16px}
.tsbox{background:var(--panel);color:var(--text);border-radius:18px;max-width:1120px;width:100%;max-height:95vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.tsgrid{display:grid;grid-template-columns:minmax(260px,1.05fr) minmax(min(280px,100%),1fr);gap:24px;margin-top:14px}
@media(max-width:860px){.tsgrid{grid-template-columns:1fr}}
.tsprev{position:relative;background:#000;border-radius:12px;display:grid;place-items:center;min-height:220px}
.tsprev img{width:100%;max-height:62vh;object-fit:contain;border-radius:12px;display:block}
.tsbusy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;border-radius:12px;font-weight:600}
.tschips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.tschip{padding:7px 13px;border:1px solid var(--line);border-radius:99px;cursor:pointer;background:var(--panel2);font-size:13.5px;user-select:none}
.tschip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.sws{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.sw{width:27px;height:27px;border-radius:50%;border:2px solid var(--line);cursor:pointer}.sw.on{outline:3px solid var(--accent);outline-offset:1px}
.sws input[type=color]{width:34px;height:30px;padding:0;border:0;background:none;cursor:pointer}
.tsvars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.tsvar{border:2px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;background:var(--panel2);text-align:center;position:relative}
.tsvar:hover{border-color:var(--accent)}.tsvar img{width:100%;border-radius:8px;display:block;background:#000}.tsvar .tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px}
.tsvar.wait{display:grid;place-items:center;min-height:90px;color:var(--muted);font-size:12px}
.edbox{max-width:1180px}.edgrid{display:grid;grid-template-columns:minmax(min(260px,100%),1fr) 300px;gap:20px;margin-top:12px}
@media(max-width:900px){.edgrid{grid-template-columns:1fr}}
.edstage{display:grid;place-items:center;background:repeating-conic-gradient(#2a2f3a 0 25%,#232833 0 50%) 0 0/20px 20px;border-radius:12px;padding:10px;min-height:240px}
.edstage canvas{max-width:100%;touch-action:none;cursor:crosshair;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.edtools{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}.edtools button{padding:7px 11px}.edtools button.on{border-color:var(--accent);background:var(--accent-soft)}
.edemo{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.edemo button{font-size:21px;padding:3px 7px;line-height:1.2}
.edsec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.edsec h4{margin:0 0 8px;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.edsec label{margin-top:8px}.edsec input[type=range]{width:100%}
pre.log{background:#080b10;color:#cbd5e1;border:1px solid var(--line);border-radius:10px;padding:14px;max-height:360px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all;margin:10px 0 0}
.banner{background:var(--info-soft);border:1px solid var(--accent2);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent2);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin,.pill.live .d{animation:none}html{scroll-behavior:auto}}
.empty{color:var(--muted);text-align:center;padding:36px 20px}
.steps{margin:0 0 0 18px;padding:0}.steps li{margin:4px 0}
/* ---- video drawer */
.drawer{position:fixed;inset:0;background:rgba(10,5,2,.66);backdrop-filter:blur(3px);display:none;z-index:10}
.drawer.open{display:flex;justify-content:flex-end}
.drawer .panel{background:var(--bg);width:min(780px,100%);height:100%;overflow:auto;padding:26px 28px;border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.3)}
video{width:100%;max-height:440px;background:#000;border-radius:12px}
.media{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.media img{width:100%;border-radius:12px;max-height:440px;object-fit:contain;background:var(--panel2)}
.vcard{display:grid;grid-template-columns:150px 1fr;gap:18px}
.vcard img{width:150px;border-radius:10px;background:var(--panel2);object-fit:cover}
.toast{position:fixed;bottom:22px;right:22px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);padding:12px 16px;border-radius:12px;z-index:20;max-width:400px;box-shadow:var(--shadow)}
.toast.err{border-left-color:var(--bad)}
/* ---- settings */
.settings{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
.stabs{position:sticky;top:20px;display:flex;flex-direction:column;gap:4px}
.stabs button{justify-content:flex-start;width:100%;background:transparent;border-color:transparent;color:var(--muted);padding:11px 14px}
.stabs button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stabs button:hover{background:var(--panel2);color:var(--text)}
.stabs button.on{background:var(--panel);border-color:var(--line);color:var(--text);box-shadow:var(--shadow)}
.stabs .st{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.warn{background:var(--warn-soft);color:var(--warn)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));column-gap:20px}
.fields .full{grid-column:1/-1}
.help{color:var(--muted);font-size:12px;margin:5px 0 0}
.savebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);margin:22px -20px -18px;padding:14px 20px;background:var(--panel2);border-radius:0 0 var(--radius) var(--radius)}
.secdesc{color:var(--muted);margin:-4px 0 4px;max-width:68ch}
.keyhint{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.pstepsl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.pstep{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--panel2);color:var(--muted)}
.pstep .pi{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--panel3);flex:none}
.pstep.done{color:var(--text)}.pstep.done .pi{background:var(--ok-soft);color:var(--ok)}
.pstep.now{color:var(--text);background:var(--info-soft)}.pstep.now .pi{background:transparent}
.pstep.bad .pi{background:var(--bad-soft);color:var(--bad)}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px}
.typecard{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;margin:0;color:var(--text);transition:border-color .15s,background .15s}
.typecard:hover{border-color:var(--panel3)}
.typecard:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.typecard .tt{display:flex;align-items:center;gap:9px;font-size:14px}
.typecard span.muted{font-size:12.5px;line-height:1.4}
#authov{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.authbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
.authmsg{margin:12px 0 0;padding:10px 14px;border-radius:10px;font-size:13.5px}
.authmsg.ok{background:var(--ok-soft);color:var(--ok)}.authmsg.bad{background:var(--bad-soft);color:var(--bad)}
.userchip{display:flex;align-items:center;gap:10px;padding:8px 6px 0}
.userchip .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--ember));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.userchip .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}.userchip .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userchip .who span{color:var(--muted);font-size:12px}
.userchip button{padding:6px 8px}
.upnote{margin-top:8px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;display:inline-block;background:var(--info-soft);color:var(--accent2)}
.upnote.error,.upnote.needs_youtube{background:var(--warn-soft);color:var(--warn)}
/* ---- responsive */
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;padding:12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{width:100%;margin-bottom:6px}.navgroup,.sidefoot,nav .sp{display:none}
  nav a{padding:7px 11px}
  main{padding:20px 16px 48px}
  .settings{grid-template-columns:1fr}.stabs{position:static;flex-direction:row;overflow:auto}.stabs button{width:auto;white-space:nowrap}
  .vcard,.media{grid-template-columns:1fr}
  h1{font-size:22px}
}
/* ===== page components ===== */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 18px}
.toolbar .grow{flex:1 1 220px}
.toolbar input[type=search],.toolbar select{width:auto;min-width:160px}
.toolbar input[type=search]{flex:1 1 240px;max-width:340px}
.sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sechead h2{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:20px}
.kpi{display:flex;gap:14px;align-items:center;padding:16px 18px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
a.kpi:hover{transform:translateY(-2px);border-color:var(--panel3);text-decoration:none}
.kpi .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--panel2);color:var(--muted)}
.kpi .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi .ic.warn{background:var(--warn-soft);color:var(--warn)}.kpi .ic.ok{background:var(--ok-soft);color:var(--ok)}.kpi .ic.info{background:var(--info-soft);color:var(--accent2)}.kpi .ic.bad{background:var(--bad-soft);color:var(--bad)}
.kpi .n{font-size:28px;font-weight:750;line-height:1.1;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.cols>div,.cols>aside{display:flex;flex-direction:column;gap:20px;min-width:0}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;align-items:start}
.vc{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column}
.vc:hover,.vc:focus-visible{transform:translateY(-3px);border-color:var(--panel3);box-shadow:var(--shadow);outline:0}
.vc-img{position:relative;aspect-ratio:9/16;background:var(--panel2);overflow:hidden}
.vc-img.wide{aspect-ratio:16/9}
.vc-img img{width:100%;height:100%;object-fit:cover;display:block}
.vc-img .badge{position:absolute;top:10px;left:10px;backdrop-filter:blur(6px);background:rgba(10,14,22,.72);color:#fff}
.vc-img .badge.public{background:var(--ok);color:#06281d}.vc-img .badge.rendered{color:var(--accent2)}.vc-img .badge.uploaded{color:var(--ok)}.vc-img .badge.declined{color:#b7bfce}
.vc-body{padding:12px 14px 14px}
.vc-title{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.vc-meta{font-size:12.5px;margin-top:6px}
.approve{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.approve:first-of-type{border-top:0}
.approve img{width:84px;height:112px;object-fit:cover;border-radius:10px;background:var(--panel2);cursor:pointer}
.approve .acts{display:flex;flex-direction:column;gap:8px;min-width:190px}
.approve .acts button{justify-content:center}
.allclear{display:flex;gap:14px;align-items:center;color:var(--muted)}
.allclear .ic{width:40px;height:40px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.allclear .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.checklist{display:flex;flex-direction:column;gap:2px}
.checklist .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.checklist .it:first-child{border-top:0}
.checklist .it .t{flex:1;min-width:0}.checklist .it .t b{display:block;font-weight:600}.checklist .it .t span{color:var(--muted);font-size:12.5px}
.nextup .it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.nextup .it:first-child{border-top:0}
.nextup .when{font-weight:650;min-width:74px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel3);color:var(--muted)}
.chip.live{background:var(--info-soft);color:var(--accent2)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
/* games */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:18px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.gcard.off{opacity:.62}
.gcard header{display:flex;align-items:center;gap:14px}
.gicon{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--ember));flex:none}
.gcard header .gt{flex:1;min-width:0}.gcard header b{font-size:16px}
.gmeta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0}
.gmeta dt{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.gmeta dd{margin:2px 0 0;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.switch{position:relative;display:inline-block;width:42px;height:24px;margin:0;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--panel3);border-radius:99px;cursor:pointer;transition:background .2s}
.switch span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}
.switch input:checked+span{background:var(--ok)}.switch input:checked+span:before{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent2);outline-offset:2px}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more>summary{cursor:pointer;font-weight:600;color:var(--accent2);list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary:after{content:"▾";transition:transform .2s;color:var(--muted)}
details.more[open]>summary:after{transform:rotate(180deg)}
details.more>*:not(summary){margin-top:12px}
/* create */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{flex-direction:column;align-items:flex-start;gap:3px;padding:14px 16px;text-align:left;border-radius:12px}
.choice b{font-size:15px}.choice span{color:var(--muted);font-weight:400;font-size:12.5px}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on span{color:var(--text)}
.fgroup{margin-top:20px}
.fgroup>h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 -4px;font-weight:700}
.logwrap{position:relative}
/* twitch steps */
.steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.step .no{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.step b{display:block}.step span{color:var(--muted);font-size:12.5px}
/* drawer */
.dhead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.dhead h1{font-size:20px;line-height:1.3;margin:0}
.dsec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:16px}
.dsec>h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 4px;font-weight:700}
.dactions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty .ic{display:block;margin:0 auto 10px;width:40px;height:40px;color:var(--muted);opacity:.7}
.empty .ic svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
@media (max-width:620px){.gcards{grid-template-columns:1fr}.approve{grid-template-columns:70px 1fr}.approve .acts{grid-column:1/-1;flex-direction:row}.gmeta{grid-template-columns:1fr}.choices{grid-template-columns:1fr}}

/* ===== bell, notifications, profile ===== */

/* ===== create: the picker layout ===== */
#pk_source{grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}#pk_source .pk b{font-size:13.5px}
.crt{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}

.crt-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.crt-side{position:sticky;top:18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:1180px){.crt-side{position:static}}
.crt-sec{padding:22px 24px}
.crt-h{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.crt-h h2{margin:0;font-size:18px}.crt-h p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

.crt-seg button{padding:8px 16px}

.crt-kind .choice b{font-size:18px}.crt-kind .choice .kd{font-size:13px;line-height:1.45}
.kart{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent2);margin-bottom:6px}
.choice.on .kart{background:linear-gradient(135deg,#ffb04a,#ff6a00 60%,var(--ember));color:var(--onaccent)}
.kart svg,.pki svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pk{flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:20px;background:var(--panel2);text-align:left;color:var(--muted);transition:border-color .15s,box-shadow .2s,transform .12s,background .2s}

.pkchip.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}.pkchip.on i{background:linear-gradient(135deg,#ffb04a,#ff6a00);color:var(--onaccent)}

.pkmini .pk.on{background:var(--accent-soft);box-shadow:none;border-color:var(--accent)}

.crt-go{width:100%;justify-content:center;padding:15px;font-size:16px;border-radius:18px}

.crt-sec details.more>summary{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px 16px;color:var(--text)}
.crt-sec details.more>summary:hover{border-color:color-mix(in srgb,var(--line) 50%,var(--accent) 50%)}
.crt-sec details.more+details.more{margin-top:10px}
.crt-sec details.more[open]>summary{border-color:var(--accent)}

/* ===== pickers on every page ===== */
main{min-width:0}.card{min-width:0}.card:has(>table),.card>div:has(>table){overflow-x:auto}.toolbar .pkbar{max-width:100%}

.rlreq{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.rlmon{border-radius:14px;padding:10px 12px;font-size:13.5px;background:var(--panel3);display:flex;flex-direction:column;gap:2px}.rlmon span{color:var(--muted)}
.rlmon.yes{background:var(--ok-soft)}.rlmon.conditional{background:var(--warn-soft)}
.rev{padding:8px 0;border-top:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}.rev q{display:block;color:var(--muted);margin-top:3px;font-style:italic}
.rla{gap:8px;align-items:center}.rlnotes{flex:1;min-width:180px}
.rl details.more{border:0;padding:0}

/* ===== phone layout: a slim sticky top bar with a menu button; the page links open in a panel ===== */
.menubtn{display:none}
@media (max-width:980px){
  html,body{overflow-x:hidden}
  nav{position:sticky;top:0;z-index:60;flex-wrap:nowrap;align-items:stretch;flex-direction:column;padding:8px 12px;gap:0;max-height:100vh;max-height:100dvh;overflow:auto;background:var(--panel)}
  nav .brand{width:100%;margin:0;padding:2px 0;min-height:46px;align-items:center}
  nav .brand .bell{margin-left:auto}
  .menubtn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border-radius:13px;background:var(--panel2);margin-left:8px;flex:none}
  .menubtn svg{width:20px;height:20px}
  nav a,nav .sidefoot,nav .navgroup,nav .sp{display:none}
  nav.open{box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
  nav.open .navlinks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  nav.open a{display:flex;margin:0;padding:6px 8px;min-height:46px;font-size:15px}
  nav.open .sidefoot{display:flex;flex-direction:column;gap:10px;margin:12px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
  nav.open .navgroup,nav.open .sp{display:none}
  main{padding:16px 14px 40px;min-width:0}
  main>h1{font-size:26px;letter-spacing:-.6px}
  .lede{font-size:14.5px;margin-bottom:18px}
  .hero2{padding:20px;border-radius:22px}.hero2 h1{font-size:28px;letter-spacing:-1px}
  .hero2act .btn,.hero2act button{flex:1 1 100%;justify-content:center;min-height:46px}
  .card{padding:16px;border-radius:18px}
  button,.btn,select,input,textarea{min-height:42px}
  input,select,textarea{font-size:16px}              /* stops iOS zooming into every field */
  .row{flex-wrap:wrap}
  .stabs{gap:6px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .seg{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
  .seg button{white-space:nowrap;padding:8px 12px}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  pre,code{white-space:pre-wrap;word-break:break-word}
  img,video,canvas{max-width:100%}
  .muted{overflow-wrap:anywhere}
  .rlh{flex-wrap:wrap}.rlb{align-items:flex-start}
  .crt-h{flex-wrap:wrap}.crt-h>div{flex:1 1 180px;min-width:0}.crt-h>.seg{margin-left:0;flex:1 1 100%}.crt-h>.seg button{flex:1}
  .modal,.dlg,.sheet{max-width:100vw}
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Main"></nav>
  <main id="main"></main>
</div>
<div class="drawer" id="drawer"><div class="panel" id="drawerBody"></div></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = iso => iso ? new Date(iso).toLocaleString([], {dateStyle: "medium", timeStyle: "short"}) : "-";

async function api(path, opt = {}) {
  const o = {method: opt.method || "GET", headers: {"X-Requested-With": "studio"}};
  if (opt.body !== undefined) {
    if (opt.raw) { o.body = opt.body; } else { o.body = JSON.stringify(opt.body); o.headers["Content-Type"] = "application/json"; }
  }
  const r = await fetch(path, o);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.startsWith("/api/auth/")) { showAuth(); throw new Error(data.error || "Please log in"); }
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : ""); t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 3000);
}
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
const badge = s => `<span class="badge ${esc(s)}">${esc(s)}</span>`;

let timer = null, activeJob = null;
function stopTimer() { if (timer) clearInterval(timer); timer = null; }

/* ------------------------------------------------------------ pickers: every short list becomes chips or tiles, every time list becomes pills
   The real <select> / <input> stays in the page (hidden), so each page's own code keeps reading and writing the same values. */
(function () {
  for (const proto of [HTMLSelectElement.prototype, HTMLInputElement.prototype]) {       // a value set by code (no event) still redraws the picker
    const d = Object.getOwnPropertyDescriptor(proto, "value");
    Object.defineProperty(proto, "value", {get() { return d.get.call(this); }, set(v) { d.set.call(this, v); this.dispatchEvent(new Event("pkrefresh")); }, configurable: true});
  }
  const OFF = ".edm, .tsm, .tsbox, [hidden], .nopk";
  const split = t => { const m = t.match(/^([^:(]{2,34}?)\s*[:(]\s*(.*?)\)?$/); return m ? [m[1].trim(), m[2].trim()] : [t.trim(), ""]; };
  const enhanceSelect = sel => {
    if (sel.dataset.pk || sel.multiple || sel.closest(OFF)) return;
    const n = sel.options.length; if (n < 2 || n > 7) return;
    sel.dataset.pk = "1";
    const longest = Math.max(...[...sel.options].map(o => o.textContent.trim().length));
    const tiles = longest > 30;
    const box = document.createElement("div"); box.className = tiles ? "pkgrid auto" : "pkbar"; box.setAttribute("role", "radiogroup");
    sel.style.display = "none"; sel.after(box);
    const render = () => {
      box.innerHTML = [...sel.options].map(o => {
        const on = o.value === sel.value, t = o.textContent.trim();
        if (!tiles) return `<button type="button" class="pkc ${on ? "on" : ""}" data-v="${esc(o.value)}" role="radio" aria-checked="${on}">${esc(t)}</button>`;
        const [a, b] = split(t);
        return `<button type="button" class="pk ${on ? "on" : ""}" data-v="${esc(o.value)}" role="radio" aria-checked="${on}"><b>${esc(a)}</b>${b ? `<span>${esc(b)}</span>` : ""}</button>`;
      }).join("");
    };
    box.addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; sel.value = b.dataset.v; sel.dispatchEvent(new Event("change", {bubbles: true})); });
    sel.addEventListener("change", render); sel.addEventListener("pkrefresh", render);
    new MutationObserver(render).observe(sel, {childList: true, subtree: true});
    render();
  };
  const enhanceTimes = inp => {
    if (inp.dataset.pk || inp.closest(OFF)) return;
    inp.dataset.pk = "1"; inp.style.display = "none";
    const box = document.createElement("div"); box.className = "pktimes"; inp.after(box);
    const list = () => [...new Set((inp.value.match(/\b\d{1,2}:\d{2}\b/g) || []).map(t => t.padStart(5, "0")))].sort();
    const render = () => {
      box.innerHTML = list().map(t => `<span class="pkt">${t}<b data-x="${t}" title="Remove">×</b></span>`).join("") +
        `<span class="pktadd"><input type="time" class="pkt-in" aria-label="Add a time"><button type="button" class="pkt-go">Add time</button></span>`;
    };
    box.addEventListener("click", e => {
      const x = e.target.closest("[data-x]");
      if (x) { inp.value = list().filter(t => t !== x.dataset.x).join(", "); return; }
      if (e.target.closest(".pkt-go")) { const v = box.querySelector(".pkt-in").value; if (v) inp.value = [...list(), v].join(", "); }
    });
    inp.addEventListener("pkrefresh", render); render();
  };
  const scan = () => {
    const main = document.getElementById("main"); if (!main) return;
    main.querySelectorAll("select:not([data-pk])").forEach(enhanceSelect);
    main.querySelectorAll("input[data-times]:not([data-pk])").forEach(enhanceTimes);
  };
  let queued = false;
  new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; scan(); }); } }).observe(document.getElementById("main"), {childList: true, subtree: true, attributes: true, attributeFilter: ["hidden"]});
})();

/* ------------------------------------------------------------ router */
const routes = {overview, games, create, videos, editor, research, reactions, notifications, profile, twitch, clips, schedule, settings, users, reports, usage, progress: overview};
/* ------------------------------------------------------------ shell: sidebar, subtitles, status */
const ICON = {
  overview: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  create: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  videos: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z"/>',
  clips: '<path d="M4 7h16M4 12h16M4 17h10"/>',
  editor: '<circle cx="6" cy="6.5" r="2.5"/><circle cx="6" cy="17.5" r="2.5"/><path d="M8 8l12 9M8 16l12-9"/>',
  games: '<rect x="2.5" y="7" width="19" height="11" rx="4"/><path d="M7 12h4M9 10v4M15.5 11.5h.01M18 13h.01"/>',
  schedule: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
  twitch: '<path d="M4 4h16v10l-4 4h-4l-3 3v-3H4z"/><path d="M12 8v4M16 8v4"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/>',
  music: '<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
};
const svg = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
let ME = null;
Object.assign(ICON, {usage: '<circle cx="12" cy="12" r="8"/><path d="M12 7.5v9"/><path d="M14.5 9.5h-3.2a1.6 1.6 0 0 0 0 3.2h1.4a1.6 1.6 0 0 1 0 3.2H9.5"/>', reports: '<path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/>', users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14.5c2.2.3 3.6 1.8 4 4.5"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"/>', logout: '<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>'});
function buildShell() {
  const owner = ME.role === "owner";
  const NAV = [["Workspace", [["overview", "Overview"], ["create", "Create"], ["videos", "Videos"], ["editor", "Editor"], ["clips", "Clips"]]],
               ["Automation", [["games", "Games"], ["schedule", "Schedule"], ["research", "Research"]].concat(owner ? [["reactions", "Reaction Lab"]] : [])],
               ["Publishing", [["twitch", "Twitch helper"]]],
               ["System", [["usage", "My usage"], ["profile", "Profile"], ["notifications", "Notifications"], ["settings", "Settings"]].concat(owner ? [["users", "Users"], ["reports", "Reports"]] : [])]];
  const initials = (ME.name || ME.email).split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  $("#nav").innerHTML = `<div class="brand"><div class="logo">${svg("videos")}</div><div>CLIP <span>STUDIO</span></div><button class="bell" id="bell" title="Notifications" aria-label="Notifications">${svg("bell")}<i id="bellc" hidden>0</i></button><button class="menubtn" id="menubtn" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>` +
    `<div class="navlinks">` + NAV.map(([g, items]) => `<div class="navgroup">${g}</div>` + items.map(([r, t]) => `<a href="#/${r}" data-r="${r}">${svg(r)}<span>${t}</span>${r === "reactions" ? `<i class="betatag">BETA</i>` : ""}</a>`).join("")).join("") + `</div>` +
    `<div class="sp"></div><div class="sidefoot"><div class="pill" id="jobpill"><span class="d"></span><span id="jobtxt">Idle</span></div>
     <button id="themebtn" title="Switch light / dark">${svg("moon")}<span>Light / dark</span></button>
     <div class="userchip">${avatarMini(initials)}<div class="who"><b>${esc(ME.name)}</b><span id="whoSub">${owner ? "Owner" : "Member"}</span></div><button id="logoutbtn" title="Log out">${svg("logout")}</button></div></div>`;
  $("#bell").onclick = toggleNotifPanel; setBadge(NOTIF.unread);
  const navEl = $("#nav"), mb = $("#menubtn");
  const closeMenu = () => { navEl.classList.remove("open"); mb.setAttribute("aria-expanded", "false"); };
  mb.onclick = () => { const o = navEl.classList.toggle("open"); mb.setAttribute("aria-expanded", o ? "true" : "false"); };
  navEl.addEventListener("click", e => { if (e.target.closest("a")) closeMenu(); });
  window.addEventListener("hashchange", closeMenu);
  $("#jobpill").style.cursor = "pointer"; $("#jobpill").title = "Click to see what is running"; $("#jobpill").onclick = () => openProgress();
  $("#themebtn").onclick = () => {
    const dark = (document.documentElement.dataset.theme || "dark") === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", document.documentElement.dataset.theme); } catch (e) {}
  };
  $("#logoutbtn").onclick = async () => { try { await api("/api/auth/logout", {method: "POST"}); } catch (e) {} location.hash = ""; location.reload(); };
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
}
const SUBS = {
  reactions: "Beta. Find the moments people react to in a video, judge them, and let the studio learn what a good reaction means for your channel. Runs on its own: it changes nothing else.",
  research: "Claude searches the web for creators that allow clipping, clipping programmes and campaigns, what they want, and whether you can earn on your own channel. Every answer comes with proof.",
  notifications: "What happened with your videos, uploads and tokens.",
  editor: "Cut a stream replay, a YouTube video or your own file, choose the screen shape, add captions and text, and save it to your Videos.",
  overview: "Everything at a glance: system health, videos waiting for your decision, and what the studio is doing.",
  games: "Add every game you want to cover, each with its own clip sources and branding. Runs pick one game, or take turns through all enabled games (Auto).",
  create: "Start a Short or a long compilation by hand and watch it render.",
  videos: "Every video the studio has made. Preview, edit, approve or decline.",
  twitch: "Twitch has no upload API, so this makes manual uploading quick: ready title, description and files.",
  clips: "The source clips and live moments the studio has downloaded.",
  schedule: "When videos are made automatically, which game is next, and what each run did.",
  settings: "Connect your accounts, choose your audience, and set up email alerts.",
  users: "Approve new members, switch accounts on or off, and watch how busy the server is.",
  reports: "What the studio used, what it cost you in real dollars, what members were billed, and what is left over.",
  usage: "Your tokens: what you used, what each video cost, your uploads today, and your whole token history.",
};
async function pollJobPill() {
  try {
    const jobs = await api("/api/jobs"); const r = jobs.find(j => j.status === "running");
    $("#jobpill").classList.toggle("live", !!r);
    $("#jobtxt").textContent = r ? `Working: ${r.mode.replace("auto-", "")}` : "Idle";
  } catch (e) {}
}

/* reload by itself when the dashboard was updated, so an old tab never keeps running old code */
let uiVersion = null;
async function checkUiVersion() {
  try {
    const v = (await api("/api/ui-version")).v;
    if (uiVersion === null) uiVersion = v;
    else if (v !== uiVersion && !$("#drawer").classList.contains("open")) location.reload();
  } catch (e) {}
}



function nav() {
  stopTimer();
  const r = (location.hash.replace("#/", "") || "overview").split("/")[0];
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.r === r));
  const run = (routes[r] || overview)();
  if (r === "progress") setTimeout(() => openProgress(), 400);
  const h1 = $("#main h1"); if (h1 && !$("#main .lede") && SUBS[r]) h1.insertAdjacentHTML("afterend", `<p class="lede">${SUBS[r]}</p>`);
  run.catch(e => { $("#main").innerHTML = `<div class="card">Error: ${esc(e.message)}</div>`; });
}
addEventListener("hashchange", nav);
/* ------------------------------------------------------------ sign in / sign up */
let authShown = false;
async function showAuth() {
  if (authShown) return; authShown = true;
  let st = {needs_owner: false, signup: "approval", local: true};
  try { st = await fetch("/api/auth/status").then(r => r.json()); } catch (e) {}
  const ov = document.createElement("div"); ov.id = "authov";
  const first = st.needs_owner;
  let mode = first || (/[?&]signup=1/.test(location.search) && st.signup !== "closed") ? "signup" : "login";
  const draw = (msg, ok) => {
    const signup = mode === "signup";
    ov.innerHTML = `<div class="authwrap"><div class="authhero"><h2>Turn game clips into <em>channel growth</em>.</h2>
      <p>Find the best moments, edit them into videos, make the thumbnail and upload to your own YouTube channel.</p>
      <ul><li>Finds clips from Twitch and YouTube for you</li><li>Edits, adds voice, captions and thumbnails</li><li>You pay only for what each video really uses</li></ul></div>
      <div class="authbox"><div class="brand" style="margin:0 0 6px"><div class="logo">${svg("videos")}</div><div>CLIP <span>STUDIO</span></div></div>
      <h1 style="margin:14px 0 4px">${first ? "Create the owner account" : signup ? "Create your account" : "Welcome back"}</h1>
      <p class="muted" style="margin:0 0 6px">${first ? "This is the first account, so it becomes the owner with full access." : signup ? (st.signup === "open" ? "You can log in right after you sign up." : "The owner has to approve your account before you can log in.") : "Log in to your workspace."}</p>
      ${msg ? `<div class="authmsg ${ok ? "ok" : "bad"}">${esc(msg)}</div>` : ""}
      ${signup ? `<label>Name</label><input id="a_name" autocomplete="name" maxlength="60">` : ""}
      <label>Email</label><input id="a_email" type="email" autocomplete="email">
      <label>Password ${signup ? "(at least 8 characters)" : ""}</label><input id="a_pw" type="password" autocomplete="${signup ? "new-password" : "current-password"}">
      ${first && !st.local ? `<label>Setup code</label><input id="a_code" autocomplete="off" placeholder="shown in the server console"><div class="help">Run <code>python worker.py --show-setup-code</code> on the server to see it.</div>` : ""}
      <button class="pri" id="a_go" style="width:100%;justify-content:center;margin-top:18px">${first ? "Create owner account" : signup ? "Sign up" : "Log in"}</button>
      ${first || st.signup === "closed" ? "" : `<p class="muted" style="text-align:center;margin:14px 0 0">${signup ? "Already have an account?" : "New here?"} <a href="#" id="a_sw">${signup ? "Log in" : "Create an account"}</a></p>`}
      ${first ? "" : `<a class="authlink" href="/">&larr; Back to the home page</a>`}</div></div>`;
    $("#a_go").onclick = go; ov.querySelectorAll("input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") go(); });
    const sw = $("#a_sw"); if (sw) sw.onclick = e => { e.preventDefault(); mode = signup ? "login" : "signup"; draw(); };
    (signup ? $("#a_name") : $("#a_email")).focus();
  };
  const go = async () => {
    const body = {email: $("#a_email").value, password: $("#a_pw").value};
    if (mode === "signup") { body.name = $("#a_name").value; if ($("#a_code")) body.setup_code = $("#a_code").value; }
    $("#a_go").disabled = true;
    try {
      const r = await api(mode === "signup" ? "/api/auth/signup" : "/api/auth/login", {method: "POST", body});
      if (mode === "login" || r.logged_in) { location.reload(); return; }
      mode = "login"; draw(r.message, true);
    } catch (e) { draw(e.message, false); }
  };
  document.body.appendChild(ov); draw();
}
let TOK = null;
let DIY = null;
async function getDiy() { if (!DIY) DIY = await api("/api/diy"); return DIY; }
async function refreshTokens() {
  try { TOK = await api("/api/tokens"); const el = $("#whoSub"); if (el) el.textContent = TOK.owner ? "Owner · free" : `${TOK.balance} tokens · ${TOK.uploaded_today}/${TOK.daily_uploads} uploads today`; } catch (e) {}
}

/* ------------------------------------------------------------ live progress panel */
const fmtDur = sec => { const m = Math.floor(sec / 60); return m ? `${m} min ${sec % 60} s` : `${sec} s`; };
function progressHtml(j) {
  const p = j.progress, owner = ME.role === "owner";
  const done = j.status === "done", failed = j.status === "failed" || j.status === "cancelled", queued = j.status === "queued", running = !done && !failed && !queued;
  const what = p.kind === "remix" ? "Remaking your video with the new audio" : `Making a ${p.kind === "compilation" ? "compilation" : "Short"}${p.game ? " · " + esc(p.game) : ""}`;
  const left = running ? Math.max(15, p.typical - p.elapsed) : 0;
  const meta = done ? `Finished in ${fmtDur(p.elapsed)}` : failed ? "" : queued ? "Not started yet" :
    `Running for ${fmtDur(p.elapsed)} · usually about ${Math.max(1, Math.round(p.typical / 60))} min${p.elapsed < p.typical ? ` · about ${Math.max(1, Math.round(left / 60))} min left` : " · almost there"}`;
  const steps = p.steps.map((s, i) => {
    const icon = s.state === "done" ? "✓" : s.state === "now" ? '<span class="spin"></span>' : s.state === "bad" ? "!" : i + 1;
    return `<div class="pstep ${s.state}"><span class="pi">${icon}</span><span>${esc(s.label)}</span></div>`;
  }).join("");
  return `<div class="pgx ${done ? "ok" : failed ? "bad" : ""}">
    <div class="pgx-top"><div class="pgx-ring" style="--p:${p.percent}"><span>${p.percent}%</span></div>
      <div style="min-width:0"><div class="pgx-title">${what}</div><div class="pgx-now">${esc(p.message)}${running ? '<span class="dots"></span>' : ""}</div><div class="muted" style="margin-top:3px">${meta}</div></div></div>
    <div class="pgx-bar"><i style="width:${p.percent}%"></i></div>
    <div class="pstepsl">${steps}</div>
    ${p.highlights.length ? `<div class="pgx-so"><h4>So far</h4>${p.highlights.map(x => `<div>${esc(x)}</div>`).join("")}</div>` : ""}
    ${owner && j.log ? `<details class="more" style="margin-top:14px"><summary>Technical log (owner only)</summary><pre class="log" style="max-height:300px">${esc((j.log || []).join("\n") || "(no output yet)")}</pre></details>` : ""}
  </div>`;
}
async function openProgress(id) {
  if (!id) { try { const jobs = await api("/api/jobs"); const r = jobs.find(j => j.status === "running") || jobs[0]; id = r && r.id; } catch (e) {} }
  if (!id) { toast("Nothing is running right now"); return; }
  $("#drawerBody").innerHTML = `<div class="dhead"><div><h1 id="ph">Progress</h1><div class="row" style="margin-top:8px" id="pmeta"></div></div><button id="x">Close</button></div>
    <div class="dsec" id="pgbox">Loading…</div>
    <div class="dactions" style="margin-top:12px"><button class="dng" id="pcancel" hidden>Cancel this run</button><button class="pri" id="pvideo" hidden>Open the video</button></div>`;
  $("#drawer").classList.add("open"); $("#x").onclick = closeDrawer;
  const tick = async () => {
    let j; try { j = await api(`/api/jobs/${id}`); } catch (e) { return; }
    if (!$("#pgbox")) return;
    $("#ph").textContent = j.progress.kind === "remix" ? "Remaking your video" : `Making a ${j.progress.kind === "compilation" ? "compilation" : "Short"}`;
    $("#pmeta").innerHTML = `${badge(j.status)}<span class="muted">${j.source === "n8n" ? "scheduled run" : j.source === "remix" ? "new audio" : "started by hand"}</span>`;
    const open = $("#pgbox details") && $("#pgbox details").open;
    $("#pgbox").innerHTML = progressHtml(j);
    if (open && $("#pgbox details")) $("#pgbox details").open = true;
    $("#pcancel").hidden = j.status !== "running" && j.status !== "queued";
    $("#pcancel").onclick = guard(async () => { if (!confirm("Cancel this run? Nothing is charged for a cancelled run.")) return; await api(`/api/jobs/${id}/cancel`, {method: "POST"}); toast("Cancelling…"); });
    $("#pvideo").hidden = !(j.status === "done" && j.video_id);
    if (j.video_id) $("#pvideo").onclick = () => openVideo(j.video_id);
    if (j.status !== "running" && j.status !== "queued" && progTimer) { clearInterval(progTimer); progTimer = null; }
  };
  if (progTimer) clearInterval(progTimer);
  await tick(); progTimer = setInterval(tick, 2000);
}

      <tr class="click" data-j="${j.id}"><td>${when(j.created_at)}</td><td>${esc(j.mode.replace("auto-", ""))}</td><td>${j.source === "n8n" ? "scheduled" : "by hand"}</td><td>${badge(j.status)}</td>
      <td class="muted">${esc(j.error || (j.video_id ? "video saved" : ""))}</td></tr>`).join("")}</table>` : emptyState("film", "No runs yet", "Your runs will be listed here.");
    document.querySelectorAll("#jobs tr[data-j]").forEach(tr => tr.onclick = () => { activeJob = tr.dataset.j; refresh(); });
    const running = jobs.find(j => j.status === "running");
    $("#go").disabled = !!running; $("#hint").textContent = running ? "Something is already rendering." : "";
    if (!activeJob && running) activeJob = running.id; if (!activeJob && jobs[0]) activeJob = jobs[0].id;
    if (activeJob) {
      const j = await api(`/api/jobs/${activeJob}`);
      const dopen = $("#jobHead details") && $("#jobHead details").open;
      $("#jobHead").innerHTML = progressHtml(j);
      if (dopen && $("#jobHead details")) $("#jobHead details").open = true;
      $("#cancel").hidden = j.status !== "running" && j.status !== "queued";
      const vl = $("#vlink"); vl.hidden = !j.video_id; if (j.video_id) { vl.href = "#/videos"; vl.onclick = () => setTimeout(() => openVideo(j.video_id), 50); }
    }
  });
  await refresh(); timer = setInterval(refresh, 2000);
}

  const setTw = guard(async (id, status, url) => { await api(`/api/videos/${id}/twitch`, {method: "POST", body: {status, url: url || ""}}); toast("Saved"); load(); });
  const copy = guard(async text => { await navigator.clipboard.writeText(text); toast("Copied"); });
  const load = guard(async () => {
    const list = await api("/api/videos?twitch=" + $("#tf").value);
    const box = $("#tlist");
    if (!list.length) { box.innerHTML = `<div class="card">${emptyState("check", "Nothing here", "No videos in this list.")}</div>`; return; }
    box.innerHTML = list.map(v => { const p = v.twitch_pack, t = v.twitch || {status: "pending"}; return `
      <div class="card vcard" style="margin-bottom:16px" data-id="${v.id}"><img alt="" loading="lazy" src="/media/${v.id}/thumb"><div>
        <div class="row"><b class="grow">${esc(v.title)}</b>${badge(t.status)}<span class="muted">${kindLabel(v.kind)}${v.file_mb ? " · " + v.file_mb + " MB" : ""}</span></div>
        <label>Twitch title</label><div class="row"><input class="grow" readonly value="${esc(p.title)}"><button data-a="ct">Copy</button></div>
        <label>Twitch description</label><div class="row" style="align-items:flex-start"><textarea class="grow" readonly style="min-height:90px">${esc(p.description)}</textarea><button data-a="cd">Copy</button></div>
        ${p.category ? `<label>Twitch category to pick</label><div class="row"><input class="grow" readonly value="${esc(p.category)}"><button data-a="cc">Copy</button></div>` : ""}${p.tags && p.tags.length ? `<label>Tags (Twitch allows up to 10)</label><div class="row"><input class="grow" readonly value="${esc(p.tags.join(", "))}"><button data-a="cg">Copy</button></div>` : ""}
        <div class="row" style="margin-top:14px"><a class="btn" href="/media/${v.id}/video?download=1">Download video</a>${ME.role === "owner" ? `<button data-a="rv">Show in folder</button>` : ""}<a class="btn" href="https://dashboard.twitch.tv/" target="_blank" rel="noopener">Open Twitch</a></div>
        <div class="row" style="margin-top:12px">${t.status === "uploaded" ? `${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">Open on Twitch</a>` : ""}<button data-a="undo">Undo</button>`
          : `<input class="grow" data-f="url" placeholder="Twitch video link (optional)"><button class="pri" data-a="done">Mark as uploaded</button><button data-a="skip">Skip</button>`}</div></div></div>`; }).join("");
    box.querySelectorAll(".vcard").forEach(card => {
      const id = card.dataset.id, v = list.find(x => x.id === id);
      card.querySelectorAll("button[data-a]").forEach(b => b.onclick = () => ({
        ct: () => copy(v.twitch_pack.title), cd: () => copy(v.twitch_pack.description), cc: () => copy(v.twitch_pack.category), cg: () => copy(v.twitch_pack.tags.join(", ")),
        rv: guard(async () => { await api(`/api/videos/${id}/reveal`, {method: "POST"}); }),
        done: () => setTw(id, "uploaded", (card.querySelector("[data-f=url]") || {}).value), skip: () => setTw(id, "skipped"), undo: () => setTw(id, "pending"),
      })[b.dataset.a]());
    });
  });
  $("#tf").onchange = load; await load();
}

/* ------------------------------------------------------------ schedule */
async function schedule() {
  $("#main").innerHTML = `<h1>Schedule</h1><div id="schov"></div><div id="scheditor" style="margin-top:18px"></div>`;
  let tz = "UTC", prevRunning = false;
  const at = (iso, long) => iso ? new Date(iso).toLocaleString("en-GB", {timeZone: tz, weekday: "short", day: "numeric", month: "short",
    hour: "2-digit", minute: "2-digit"}) : "-";
  const span = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };
  const kindName = k => k === "compilation" ? "Compilation" : "Short";
  const refresh = async () => {
    let o; try { o = await api("/api/schedule/overview"); } catch (e) { return; }
    if (!$("#schov")) return;
    tz = o.timezone;
    const now = new Date(o.now).getTime();
    const r = o.running, nxt = o.upcoming[0];
    const stateCard = r
      ? `<div class="card"><h2><span class="dot ok"></span>Working now</h2><div style="font-size:18px"><b>${esc(r.game || "choosing game…")}</b> · ${kindName(r.kind)}</div>
         <p class="muted">Started ${at(r.started)} · running ${span(now - new Date(r.started))}${r.scheduled ? " · scheduled run" : " · started by hand"}</p>
         <p class="muted">${esc(r.last_line || "starting…")}</p><button id="seeprog2">See live progress</button></div>`
      : `<div class="card"><h2><span class="dot"></span>Idle</h2><p class="muted" style="margin:0">Nothing is rendering right now.</p></div>`;
    const nextCard = nxt
      ? `<div class="card"><h2>Next run</h2><div style="font-size:18px"><b>${esc(nxt.creator ? nxt.creator + " (creator)" : nxt.game || "-")}</b> · ${kindName(nxt.kind)}</div>
         <p class="muted">${at(nxt.at)} (${tz}) · in ${span(new Date(nxt.at) - now)}</p>
         <p class="muted" style="margin-bottom:0">${nxt.creator ? "Your saved creators take turns." : "Games take turns: the one used longest ago goes next."}</p></div>`
      : `<div class="card"><h2>Next run</h2><p class="muted" style="margin:0">Nothing scheduled - turn a schedule on below.</p></div>`;
    const off = Object.entries(o.enabled).filter(([, v]) => !v).map(([k]) => k === "shorts" ? "Shorts" : "Compilations");
    const up = o.upcoming.map(u => `<tr><td>${at(u.at)}</td><td class="muted">in ${span(new Date(u.at) - now)}</td><td>${kindName(u.kind)}</td><td><b>${esc(u.creator ? u.creator + " (creator)" : u.game || "-")}</b></td></tr>`).join("");
    const hist = o.history.map(j => `<tr><td>${at(j.started)}</td><td>${kindName(j.kind)}</td><td>${esc(j.game || "-")}</td>
      <td>${j.scheduled ? "scheduled" : "by hand"}</td><td>${badge(j.status)}</td>
      <td>${j.finished ? span(new Date(j.finished) - new Date(j.started)) : "-"}</td>
      <td>${j.video ? `<a href="#/videos">${esc((j.video.title || "").slice(0, 48))}</a> ${badge(j.video.status || "")}` : `<span class="muted">${esc(j.error || "-")}</span>`}</td></tr>`).join("");
    $("#schov").innerHTML = `<div class="grid g2">${stateCard}${nextCard}</div>

const edTime = v => { v = String(v || "").trim(); if (!v) return 0; const p = v.split(":").map(Number); if (p.some(isNaN)) return 0; return p.reduce((a, b) => a * 60 + b, 0); };
function edWatch(tid, onProgress) {
  return new Promise((resolve, reject) => {
    const poll = async () => {
      try {
        const t = await api(`/api/editor/tasks/${tid}`);

        if (t.status === "done") return resolve(t.result);

    };

  });
}

    if (!vid.paused) { if (!S.segs.some(([a, b]) => t >= a - .03 && t < b)) { const nx = S.segs.find(([a]) => a > t); if (nx) vid.currentTime = nx[0]; else { vid.pause(); vid.currentTime = S.segs[S.segs.length - 1][0]; } } }

const ago = iso => { if (!iso) return ""; const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000); if (s < 60) return "just now"; if (s < 3600) return `${Math.floor(s / 60)} min ago`; if (s < 86400) return `${Math.floor(s / 3600)} h ago`; if (s < 7 * 86400) return `${Math.floor(s / 86400)} d ago`; return new Date(iso).toLocaleDateString([], {day: "numeric", month: "short"}); };
const avatarMini = initials => ME.avatar ? `<a class="av" href="#/profile" title="My profile"><img src="/api/profile/avatar?t=${AVT}" alt=""></a>` : `<a class="av" href="#/profile" title="My profile">${esc(initials)}</a>`;
const noteRow = n => `<div class="nitem ${n.read ? "" : "unread"}" data-id="${n.id}" data-link="${esc(n.link)}"><span class="nic ${esc(n.level)}">${noteIcon(n.level)}</span>

const NOTIF = {seen: null, unread: 0, open: false};
function setBadge(n) { NOTIF.unread = n; const b = $("#bellc"); if (b) { b.hidden = !n; b.textContent = n > 99 ? "99+" : n; } document.title = (n ? `(${n}) ` : "") + "Clip Studio"; }
async function pollNotifs() {
  try {
    const r = await api("/api/notifications/count");

      <label>Small text (the tag)</label><input id="ts_sub" maxlength="30" value="${esc(S.subtext)}">
      <div class="grid g2"><div><label>Text colour</label>${sw("text")}</div><div><label>Accent colour</label>${sw("accent")}</div></div>
      <label>Font</label><select id="ts_font">${opt.fonts.map(f => `<option value="${f.id}" ${f.id === S.font ? "selected" : ""}>${esc(f.name)}</option>`).join("")}</select>
      <div class="dactions" style="margin-top:16px"><button class="pri" id="ts_save">Use this thumbnail</button><button id="ts_cancel">Cancel</button></div>
    </div></div></div>`;
  document.body.appendChild(host);
  const q = sel => host.querySelector(sel), qa = sel => host.querySelectorAll(sel);
  const close = () => { if (url) URL.revokeObjectURL(url); host.remove(); };
  const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
  const mark = () => {
    q("#ts_tlab").textContent = fmt(S.t);
    qa("#ts_styles .tschip").forEach(c => c.classList.toggle("on", c.dataset.st === S.style));
    qa("#ts_src .tschip").forEach(c => c.classList.toggle("on", c.dataset.s === S.source));
    ["text", "accent"].forEach(k => qa(`#sw_${k} .sw`).forEach(c => c.classList.toggle("on", c.dataset.c.toLowerCase() === S[k].toLowerCase())));
    q("#ts_srcart").style.opacity = hasArt ? 1 : .45; q("#ts_t").disabled = S.source === "art";
  };
  const draw = () => {
    clearTimeout(tm);
    tm = setTimeout(async () => {
      busy++; q("#ts_busy").hidden = false;
      try {
        const r = await fetch(`/api/videos/${id}/thumb-preview`, {method: "POST", credentials: "same-origin", headers: {"X-Requested-With": "studio", "Content-Type": "application/json"}, body: JSON.stringify(S)});
        if (!r.ok) { const e = await r.json().catch(() => ({})); toast(e.error || "Could not draw the preview", true); }
        else { const b = await r.blob(); if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(b); q("#ts_img").src = url; }
      } finally { busy--; if (!busy) q("#ts_busy").hidden = true; }
    }, 220);
  };
  const set = (k, v) => { S[k] = v; mark(); draw(); };
  qa("#ts_styles .tschip").forEach(c => c.onclick = () => set("style", c.dataset.st));
  qa("#ts_src .tschip").forEach(c => c.onclick = () => { if (c.dataset.s === "art" && !hasArt) { toast("Make a new AI picture or use your own picture first"); return; } set("source", c.dataset.s); });
  q("#ts_t").oninput = e => set("t", +e.target.value);
  q("#ts_head").oninput = e => set("headline", e.target.value); q("#ts_sub").oninput = e => set("subtext", e.target.value);
  q("#ts_font").onchange = e => set("font", e.target.value);
  ["text", "accent"].forEach(k => { qa(`#sw_${k} .sw`).forEach(c => c.onclick = () => { q(`[data-ci=${k}]`).value = c.dataset.c; set(k, c.dataset.c); }); q(`[data-ci=${k}]`).oninput = e => set(k, e.target.value); });
  const gotArt = r => { hasArt = true; S.source = "art"; mark(); draw(); return r; };
  const drawOne = guard(async () => {
    q("#ts_art").disabled = true; q("#ts_art").textContent = "Drawing the picture… (up to a minute)";
    try { const r = await api(`/api/videos/${id}/thumb-art`, {method: "POST", body: {scene: q("#ts_scene").value}}); gotArt(r); toast(r.charged ? `New picture ready (${r.charged} token${r.charged > 1 ? "s" : ""})` : "New picture ready"); refreshTokens(); }
    finally { q("#ts_art").disabled = false; q("#ts_art").textContent = artLabel(); }
  });
  q("#ts_up").onclick = () => q("#ts_upf").click();
  q("#ts_upf").onchange = guard(async () => { const f = q("#ts_upf").files[0]; if (!f) return; const r = await api(`/api/videos/${id}/thumb-art-upload`, {method: "POST", body: f, raw: true}); gotArt(r); toast("Your picture is ready"); q("#ts_upf").value = ""; });
  q("#ts_sug").onclick = guard(async () => {
    q("#ts_sug").disabled = true;
    try { const r = await api(`/api/videos/${id}/thumb-suggest`, {method: "POST", body: {}}); q("#ts_ideas").innerHTML = r.headlines.map(h => `<span class="tschip" data-h="${esc(h)}">${esc(h)}</span>`).join(""); refreshTokens();
      qa("#ts_ideas .tschip").forEach(c => c.onclick = () => { q("#ts_head").value = c.dataset.h; set("headline", c.dataset.h); }); }
    finally { q("#ts_sug").disabled = false; }
  });
  q("#ts_save").onclick = guard(async () => { q("#ts_save").disabled = true; try { const r = await api(`/api/videos/${id}/thumb-save`, {method: "POST", body: S}); toast(r.message); close(); if (onSaved) onSaved(); } finally { if (q("#ts_save")) q("#ts_save").disabled = false; } });
  const syncInputs = () => { q("#ts_t").value = S.t; q("#ts_font").value = S.font; q("[data-ci=text]").value = S.text; q("[data-ci=accent]").value = S.accent; q("#ts_head").value = S.headline; q("#ts_sub").value = S.subtext; };
  q("#ts_cmp3").onclick = guard(async () => {
    q("#ts_cmp3").disabled = true; q("#ts_cmp3").textContent = "Drawing 3 options…";
    try {
      const r = await api(`/api/videos/${id}/thumb-variants`, {method: "POST", body: S});
      q("#ts_cmp").innerHTML = `<div class="muted" style="margin-top:12px">Click the one you like. You can still change it after.</div><div class="tsvars">${r.variants.map((v, i) => `<div class="tsvar" data-i="${i}"><span class="tag">${i + 1}</span><img src="${v.image}" alt="Option ${i + 1}"></div>`).join("")}</div>`;
      qa("#ts_cmp .tsvar").forEach(el => el.onclick = () => { Object.assign(S, r.variants[+el.dataset.i].opts); syncInputs(); mark(); draw(); toast("Option " + (+el.dataset.i + 1) + " loaded"); });
      q("#ts_cmp").scrollIntoView({behavior: "smooth", block: "nearest"});
    } finally { q("#ts_cmp3").disabled = false; q("#ts_cmp3").textContent = "⚖ Compare 3 options"; }
  });
  let pollT = null;
  const showSlots = async (info2) => {
    const slots = [1, 2, 3], b = info2.batch;
    q("#ts_cmp").innerHTML = `<div class="muted" style="margin-top:12px">${b.running ? "Drawing the pictures… each one takes up to a minute. You can keep working." : b.error ? esc(b.error) : `${info2.slots.length} picture(s) ready${b.charged ? ` · ${b.charged} token${b.charged > 1 ? "s" : ""} used` : ""}${b.failed ? ` · ${b.failed} failed (not charged)` : ""}. Click the one you like.`}</div><div class="tsvars">${slots.map(n => info2.slots.includes(n) ? `<div class="tsvar" data-slot="${n}"><span class="tag">${n}</span><img id="sl${n}" alt="Picture ${n}"></div>` : `<div class="tsvar wait">${b.running ? "waiting…" : "—"}</div>`).join("")}</div>`;
    for (const n of info2.slots) {
      const r = await fetch(`/api/videos/${id}/thumb-preview`, {method: "POST", credentials: "same-origin", headers: {"X-Requested-With": "studio", "Content-Type": "application/json"}, body: JSON.stringify({...S, source: "art", art_slot: n})});
      if (r.ok && q(`#sl${n}`)) q(`#sl${n}`).src = URL.createObjectURL(await r.blob());
    }
    qa("#ts_cmp .tsvar[data-slot]").forEach(el => el.onclick = guard(async () => { await api(`/api/videos/${id}/thumb-pick`, {method: "POST", body: {slot: +el.dataset.slot}}); hasArt = true; S.source = "art"; mark(); draw(); toast("Picture " + el.dataset.slot + " chosen"); }));
  };
  const drawMany = guard(async () => {
    q("#ts_art").disabled = true; q("#ts_art").textContent = "Drawing the pictures…";
    try { await api(`/api/videos/${id}/thumb-batch`, {method: "POST", body: {scene: q("#ts_scene").value, n: nPics}}); } catch (e) { q("#ts_art").disabled = false; q("#ts_art").textContent = artLabel(); throw e; }
    clearInterval(pollT);
    const tick = async () => { if (!document.body.contains(host)) return clearInterval(pollT); const i2 = await api(`/api/videos/${id}/thumb-batch`); await showSlots(i2); refreshTokens(); if (!i2.batch.running) { clearInterval(pollT); q("#ts_art").disabled = false; q("#ts_art").textContent = artLabel(); } };
    await tick(); pollT = setInterval(guard(tick), 5000);
  });
  q("#ts_edit").onclick = guard(async () => {
    q("#ts_edit").disabled = true;
    try {
      const r = await fetch(`/api/videos/${id}/thumb-preview`, {method: "POST", credentials: "same-origin", headers: {"X-Requested-With": "studio", "Content-Type": "application/json"}, body: JSON.stringify({...S, full: true})});
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Could not open the picture");
      openThumbEditor(id, URL.createObjectURL(await r.blob()), inf.mode, () => { close(); if (onSaved) onSaved(); });
    } finally { q("#ts_edit").disabled = false; }
  });
  q("#ts_x").onclick = q("#ts_cancel").onclick = () => { clearInterval(pollT); close(); };
  host.addEventListener("mousedown", e => { if (e.target === host) { clearInterval(pollT); close(); } });
  const markN = () => { qa("#ts_npics .tschip").forEach(c => c.classList.toggle("on", +c.dataset.n === nPics)); q("#ts_art").textContent = artLabel(); };
  qa("#ts_npics .tschip").forEach(c => c.onclick = () => { if (q("#ts_art").disabled) return; nPics = +c.dataset.n; markN(); });
  q("#ts_art").onclick = () => (nPics === 1 ? drawOne() : drawMany());
  markN();
  if (inf.slots && inf.slots.length) showSlots(inf);          // pictures that were drawn when the video was made (the 3-picture setting)
  mark(); draw();
}
