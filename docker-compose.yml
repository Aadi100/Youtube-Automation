# Clip Studio on a server.   Start:  docker compose up -d --build
# More rendering power:     docker compose up -d --scale worker=3
# Everything sensitive lives in ./config/.env (created from .env.production.example) and ./data (your files + database).

x-app: &app
  build: .
  restart: unless-stopped
  environment: &appenv
    MONGODB_URI: mongodb://mongo:27017
    MONGODB_DB: gta6_studio
    STUDIO_HOST: 0.0.0.0
    MEMBER_STORAGE_MB: ${MEMBER_STORAGE_MB:-3000}
    MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}      # videos rendered at the same time PER worker container
    UPLOAD_THREADS: ${UPLOAD_THREADS:-2}
  volumes:
    - ./config/.env:/app/.env                          # settings written by the dashboard (keys, SMTP, Google client ...)
    - ./data/outputs:/app/outputs
    - ./data/inputs:/app/inputs
    - ./data/music:/app/music
    - ./data/state:/app/state                          # model downloads (speech recognition, nudity detector) are cached here
    - ./data/temp:/app/temp
  depends_on:
    mongo:
      condition: service_healthy

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    # no ports: the database is only reachable from the other containers

  web:                                                  # dashboard + API (light)
    <<: *app
    environment:
      <<: *appenv
      STUDIO_ROLE: web
    expose:
      - "8765"

  worker:                                               # renders videos, schedules, uploads (heavy: scale this)
    <<: *app
    environment:
      <<: *appenv
      STUDIO_ROLE: worker
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY:-6g}

  caddy:                                                # HTTPS (certificate is obtained and renewed automatically)
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (next to docker-compose.yml)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - web

  backup:                                               # a database backup every night, the last 7 are kept in ./data/backups
    build: .
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: gta6_studio
    volumes:
      - ./config/.env:/app/.env
      - ./data/backups:/app/backups
    depends_on:
      mongo:
        condition: service_healthy
    command: ["sh", "-c", "while true; do python -m app.services.backup_service backup --dir /app/backups --keep 7; sleep 86400; done"]
    healthcheck:
      disable: true
